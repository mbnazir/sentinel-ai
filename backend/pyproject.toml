[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ai-backend"
version = "0.13.0"
description = "Sentinel AI enterprise workforce integrity platform"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy[asyncio]>=2.0.40,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.16,<2.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "redis>=6.2,<7.0",
  "pyjwt[crypto]>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "structlog>=25.4,<26.0",
  "httpx>=0.28,<1.0",
  "celery>=5.5,<6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.0,<2.0",
  "pytest-cov>=6.2,<7.0",
  "ruff>=0.12,<1.0",
  "mypy>=1.17,<2.0",
  "bandit>=1.8,<2.0",
  "pre-commit>=4.2,<5.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"
markers = ["postgres_integration: requires a disposable PostgreSQL database via SENTINEL_TEST_DATABASE_URL"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
