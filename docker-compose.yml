services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_ai}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes: [sentinel_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel_ai}"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes: [sentinel_redis:/data]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    ports: ["8009:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    restart: unless-stopped
  worker:
    build: ./backend
    env_file: .env
    environment:
      SENTINEL_DB_NULL_POOL: "true"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    restart: unless-stopped
  test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    command: pytest -q
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  sentinel_postgres:
  sentinel_redis:
